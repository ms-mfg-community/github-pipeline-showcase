name: CI

# Every pull request, and every push to main: install, run the acceptance gate (SPEC.md §2), run the
# gate's own tests, then prove the container image still builds.
on:
  pull_request:
  push:
    branches: [main]

# One run per ref. A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job in this workflow needs to write anything.
permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json records and fails if it disagrees with
      # package.json. This job also warms the npm cache the next job restores.
      - name: Install dependencies
        run: npm ci

  gate:
    name: Gate
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      # Creates .venv with the pinned Ruff and pytest the gate measures. Its own `npm install` finds
      # node_modules already complete after `npm ci`, so it adds nothing there.
      - name: Install the Python tooling
        run: npm run setup

      - name: Run the gate
        run: npm run gate

      - name: Run the gate's own tests
        run: npm run gate:test

  docker-build:
    name: Docker build
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GIT_COMMIT is stamped into the image so GET /api/version names the commit it was built from.
      - name: Build the container image
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: docker build --tag showcase:ci --build-arg GIT_COMMIT="$GIT_COMMIT" .
